[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers --tb=short
markers =
    unit: pure logic, no running services required
    integration: requires the Docker Compose stack to be running
    api: REST contract and status-code semantics
    e2e: full user journey across multiple services
    security: authentication, authorisation and data-protection controls
