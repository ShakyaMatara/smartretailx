events { worker_connections 1024; }

http {
    # Docker's embedded DNS. valid=10s re-resolves periodically so
    # instances added or removed by scaling are picked up.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8000;

        location / {
            # Assigning the upstream to a variable defers DNS resolution
            # to request time. Without this, nginx resolves once at
            # startup and fails to start if the service is not yet
            # running - and never sees instances added later.
            set $order_backend "order-service:8000";
            proxy_pass http://$order_backend;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Correlation-ID $http_x_correlation_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
    }
}